function sanitizeNumber(input,maxValue=Number.MAX_SAFE_INTEGER){
  const digits = input.value.replace(/\D/g,"");

  if(!digits){
    input.value = "";
    return;
  }

  const value = Math.min(Number(digits),maxValue);
  input.value = String(value);
}

function reverseCalc(){

  let oepl =
    parseInt(document.getElementById("oepl").value) || 0;

  let paepl =
    parseInt(document.getElementById("paepl").value) || 0;

  let tpu =
    parseInt(document.getElementById("tpu").value) || 0;

  let totalAmount =
    parseInt(document.getElementById("totalAmount").value) || 0;
let adultCount =
  parseInt(document.getElementById("adultCount").value);

let childCount =
  parseInt(document.getElementById("childCount").value);

let totalGuests =
  parseInt(document.getElementById("totalGuests").value);

  if(
    !isNaN(adultCount) &&
    !isNaN(childCount) &&
    !isNaN(totalGuests) &&
    adultCount + childCount !== totalGuests
  ){
    document.getElementById("result").innerHTML =
      `<div class="error-state">Adults + children (${adultCount + childCount}) must match Total Guests (${totalGuests}).</div>`;
    return;
  }

  if(
    oepl === 0 &&
    paepl === 0 &&
    tpu === 0 &&
    totalAmount === 0 &&
    isNaN(adultCount) &&
    isNaN(childCount) &&
    isNaN(totalGuests)
  ){

    document.getElementById("result").innerHTML =
      '<div class="empty-state">Enter any amount to search!</div>';

    return;
  }

  let html = "";

  combos.forEach(c => {

    let paxList = [];

    let parts = c.name.split("/");

    let adultPrice =
      parseInt(parts[0]) || 0;

    let childPrice =
      c.na
        ? 0
        : (parseInt(parts[1]) || 0);

    for(let pax = 1; pax <= 200; pax++){

      if(!isNaN(totalGuests) && pax !== totalGuests){
        continue;
      }

      let oeplMatch = true;
      let paeplMatch = true;

      if(oepl > 0){

        if(c.oepl <= 0){
          oeplMatch = false;
        } else {
          oeplMatch =
            (pax * c.oepl === oepl);
        }

      }

      if(paepl > 0){

        if(c.paepl <= 0){
          paeplMatch = false;
        } else {
          paeplMatch =
            (pax * c.paepl === paepl);
        }

      }

      if(oeplMatch && paeplMatch){

        let matches = [];

        if(c.na){

          let calcTPU =
            pax * c.adultTPU;

          let calcTotal =
            pax * adultPrice;

          if(
            pax <= 100 &&
            (tpu === 0 || calcTPU === tpu) &&
            (totalAmount === 0 || calcTotal === totalAmount) &&
            (isNaN(adultCount) || adultCount === pax) &&
            (isNaN(childCount) || childCount === 0)
          ){

            matches.push({
              adults:pax,
              children:0,
              total:calcTotal
            });

          }

        } else {

          for(let a = Math.max(0,pax - 100); a <= Math.min(100,pax); a++){

            let ch = pax - a;

            let calcTPU =
              (a * c.adultTPU) +
              (ch * c.childTPU);

            let calcTotal =
              (a * adultPrice) +
              (ch * childPrice);

            if(
  (tpu === 0 || calcTPU === tpu) &&
  (totalAmount === 0 || calcTotal === totalAmount) &&
  (isNaN(adultCount) || a === adultCount) &&
  (isNaN(childCount) || ch === childCount)
){

              matches.push({
                adults:a,
                children:ch,
                total:calcTotal
              });

            }

          }

        }

        if(matches.length > 0){

          paxList.push({
            pax:pax,
            matches:matches
          });

        }

      }

    }

    if(paxList.length > 0){

      html += `
        <div class="combo ${c.newer ? "newer" : "older"}">

          <div class="title">
            <div class="title-row">
              <span>${c.name}</span>
              ${c.newer ? "" : '<span class="older-label">older combos April-Sept 2026</span>'}
            </div>

            <div class="sub">
              Possibilities
            </div>
          </div>
      `;

      paxList.forEach(p => {

        let oeplTotal =
          c.oepl * p.pax;

        let paeplTotal =
          c.paepl * p.pax;

        html += `
          <div class="match">

            <div class="pax">
              <b>Pax:</b> ${p.pax}
            </div>

            <div class="amounts">

              TPU:
              ₹${tpu || "-"}

              <br>

              <span class="oepl-amount">OEPL: ₹${oeplTotal}
              ${c.oepl > 0
                ? `(₹${c.oepl} × ${p.pax})`
                : ""
              }</span>

              <br>

              <span class="paepl-amount">PAEPL: ₹${paeplTotal}
              ${c.paepl > 0
                ? `(₹${c.paepl} × ${p.pax})`
                : ""
              }</span>

            </div>
        `;

        p.matches.forEach(m => {

          let comboTPU =
            (m.adults * c.adultTPU) +
            (m.children * c.childTPU);

          html += `
            <div class="ac">

              A: ${m.adults}

              &nbsp; | &nbsp;

              C: ${m.children}

              &nbsp; | &nbsp;

              Total: ₹${m.total}

              &nbsp; | &nbsp;

              TPU: <span class="tpu-possibility">₹${comboTPU}</span>

            </div>
          `;

        });

        html += `
          </div>
        `;

      });

      html += `
        </div>
      `;

    }

  });

  if(html === ""){

    html = "No matching combo found.";

  }

  document.getElementById("result").innerHTML = html;

}
function resetFields(){

  document.getElementById("oepl").value = "";

  document.getElementById("paepl").value = "";

  document.getElementById("tpu").value = "";

document.getElementById("childCount").value = "";
document.getElementById("totalGuests").value = "";
}
